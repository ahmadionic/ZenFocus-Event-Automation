name: ZenFocus CI/CD

on:
  push:
    branches:
      - main

jobs:

  # 1️⃣ Build Job
  build:
    name: Build Next.js App
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

  # 2️⃣ Security Check
  security:
    name: Run Security Check
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high

  # 3️⃣ Docker Build
  docker_build:
    name: Build Docker Image
    runs-on: self-hosted
    needs: security
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t zennextapp:latest .

      - name: Push Docker image
        run: docker tag zennextapp:latest ${{ secrets.DOCKER_USERNAME }}/zennextapp:latest
      - run: docker push ${{ secrets.DOCKER_USERNAME }}/zennextapp:latest

  # 4️⃣ Deploy
  deploy:
    name: Deploy to Server
    runs-on: self-hosted
    needs: docker_build
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/zennextapp:latest
            docker stop zennextapp || true
            docker rm zennextapp || true
            docker run -d --name zennextapp -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/zennextapp:latest
